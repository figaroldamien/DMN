[build-system]
requires = []
build-backend = "setuptools.build_meta"

[project]
name = "dmn"
version = "0.1.0"
description = "Trading research applications and shared portfolio infrastructure"
readme = {text = "Local trading research workspace with shared core infrastructure and application packages such as optimal_tf.", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyvis",
    "yfinance",
    "scikit-learn",
    "torch",
    "streamlit",
    "tomli; python_version < '3.11'",
]

[project.scripts]
optimal-tf = "optimal_tf.cli.main:run"
optimal-tf-evaluate = "optimal_tf.cli.evaluate:run"
optimal-tf-compare = "optimal_tf.cli.compare:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dmn*", "market_tickers_data*", "optimal_tf*", "trading_core*"]
