[universe]
name = "cac40"
start = "1995-01-01"
quality_filter_enabled = true
quality_min_history_days = 756
quality_min_coverage_ratio = 0.9
quality_max_internal_missing = 0
quality_max_abs_return = 1.0
quality_require_latest_price = true

[estimation]
vol_span = 60
covariance_window = 150
covariance_min_periods = 60
max_abs_return = 1.0
cleaning_method = "rie_spectral"
linear_shrinkage = 0.0
rie_bandwidth = 0.001
trend_alpha = 0.01575
lltf_l2_reg = 0.0001

[backtest]
sigma_target_annual = 0.15
portfolio_vol_target = true
portfolio_vol_span = 60
cost_bps = 15.0
weight_smoothing_alpha = 0.05
long_only = false

[allocation]
strategy = "ARP"

[evaluation]
strategy = "ARP"
rebalance_frequency = "monthly"
evaluation_start = "2010-01-01"

[compare]
strategies = ["ARP", "EW", "NM", "RP"]

[output]
allocation_csv = "output/matrix_inspection/weights.csv"
allocation_json = "output/matrix_inspection/weights.json"
evaluation_dir = "output/matrix_inspection/evaluation_run"
evaluation_plot = true
compare_dir = "output/matrix_inspection/compare_run"
compare_clean_dir = true
compare_plot = true
