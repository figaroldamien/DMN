[universe]
name = "cac40"
start = "1995-01-01"
quality_filter_enabled = true
quality_min_history_days = 756
quality_min_coverage_ratio = 0.9
quality_max_internal_missing = 0
quality_max_abs_return = 1.0
quality_require_latest_price = true

[estimation]
vol_span = 60
covariance_window = 150
covariance_min_periods = 60
max_abs_return = 1.0
cleaning_method = "rie_spectral"
linear_shrinkage = 0.0
rie_bandwidth = 0.001

[evaluation]
rebalance_frequency = "monthly"
evaluation_start = "2010-01-01"

[inspection]
default_service = "Inspect at date"
snapshot_date = ""
snapshot_matrix_type = "correlation"
snapshot_input_type = "normalized_returns"
snapshot_estimator_method = "sample_window"
snapshot_output_dir = "output/matrix_inspection/snapshot"
core_periphery_graph_filter = "full_graph"
core_periphery_output_dir = "output/matrix_inspection/core_periphery"
interval_matrix_type = "correlation"
interval_input_type = "normalized_returns"
interval_estimator_method = "sample_window"
interval_output_dir = "output/matrix_inspection/interval"
leading_eigenvectors = 3
